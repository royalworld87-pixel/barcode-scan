<!doctype html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>拍照出条码</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script src="prep.js?v=4"></script>
<script src="logic.js?v=4"></script>
<style>
body{font-family:system-ui,sans-serif;margin:0;padding:14px;background:#f6f6f6;color:#222;max-width:560px;margin:auto}
h1{font-size:20px;margin:6px 0 12px}
.btn{display:block;width:100%;padding:14px;font-size:17px;border:0;border-radius:10px;background:#1a73e8;color:#fff;margin:8px 0}
.btn.gray{background:#666}
#status{font-size:14px;color:#555;margin:6px 0}
#preview{max-width:100%;border-radius:8px;display:none}
.fields{display:flex;gap:6px;margin:10px 0}
.fields button{flex:1;padding:10px 4px;border:2px solid #1a73e8;background:#fff;border-radius:8px;font-size:15px}
.fields button.on{background:#1a73e8;color:#fff}
#chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{padding:8px 10px;background:#fff;border:1px solid #ccc;border-radius:16px;font-size:15px}
label{display:block;font-size:14px;margin-top:8px;color:#444}
input{width:100%;box-sizing:border-box;padding:10px;font-size:17px;border:1px solid #bbb;border-radius:8px}
.card{background:#fff;border-radius:10px;padding:10px;margin:10px 0;text-align:center}
.card svg{max-width:100%}
.card b{display:block;margin-bottom:4px}
input.auto{background:#fffbe6}
#dchips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}
#dchips .chip{background:#eef4ff}
details{background:#fff;border-radius:8px;padding:8px;margin:8px 0;font-size:13px}
details pre{white-space:pre-wrap;word-break:break-all;max-height:300px;overflow:auto}
</style></head><body>
<h1>拍照出条码（SKU / Batch / Expiry）</h1>
<input type="file" id="cam" accept="image/*" capture="environment" hidden>
<input type="file" id="gal" accept="image/*" hidden>
<div style="display:flex;gap:8px"><button class="btn" onclick="cam.click()">📷 拍照</button><button class="btn" onclick="gal.click()">🖼️ 选照片</button></div>
<div id="status">拍好后会自动读字并填好三格（v4）。拍的时候靠近标签、对准文字、别反光。</div>
<img id="preview">
<div class="fields">
 <button data-f="sku" class="on">① SKU</button><button data-f="batch">② Batch</button><button data-f="exp">③ Expiry</button>
</div>
<div id="chips"></div>
<details id="rawbox"><summary>看看读到的原文</summary><pre id="raw"></pre></details>
<label>SKU</label><input id="sku">
<label>Batch</label><input id="batch">
<label>Expiry Date（DDMMYYYY；标签只有年月时取该月最后一天）</label><input id="exp">
<div id="dchips"></div>
<button class="btn" onclick="make()">生成条码</button>
<div id="out"></div>
<button class="btn gray" onclick="clearAll()">清空，拍下一张</button>
<script>
const $=id=>document.getElementById(id);
let cur='sku';const order=['sku','batch','exp'];const touched={};
document.querySelectorAll('.fields button').forEach(b=>b.onclick=()=>pick(b.dataset.f));
order.forEach(k=>$(k).oninput=()=>{touched[k]=1;$(k).classList.remove('auto');});
function pick(f){cur=f;document.querySelectorAll('.fields button').forEach(b=>b.classList.toggle('on',b.dataset.f==f));}
function setF(k,v){$(k).value=v;touched[k]=1;$(k).classList.remove('auto');}
$('cam').onchange=onPic;$('gal').onchange=onPic;   // v2 漏了这一行：选了照片什么都不会发生
// 三种读法：二值化 1600 (整块/零散)，灰度 2000
const PASSES=[{L:1600,mode:'bin',psm:'6'},{L:1600,mode:'bin',psm:'11'},{L:2000,mode:'gray',psm:'6'}];
let worker=null;
async function getWorker(){if(!worker)worker=await Tesseract.createWorker('eng',1,{logger:m=>{if(m.status&&m.status!='recognizing text'&&m.progress<1)$('status').textContent='准备识字模型… '+Math.round((m.progress||0)*100)+'%（第一次要下载，约 10 MB）';}});return worker;}
function loadImg(f){return new Promise((ok,bad)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>bad(new Error('打不开这张图'));i.src=URL.createObjectURL(f);});}
// 缩放（逐步减半，画质好）→ 灰度/对比度/二值化
function render(img,L,mode,rot){let w=img.naturalWidth,h=img.naturalHeight,src=img;const s=Math.min(1,L/Math.max(w,h))||1;
 const tw=Math.round(w*s),th=Math.round(h*s);
 while(w/2>tw*1.05){const c=document.createElement('canvas');c.width=Math.round(w/2);c.height=Math.round(h/2);const x=c.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(src,0,0,c.width,c.height);src=c;w=c.width;h=c.height;}
 const c=document.createElement('canvas'),x=c.getContext('2d',{willReadFrequently:true});
 if(rot){c.width=th;c.height=tw;x.translate(th/2,tw/2);x.rotate(rot*Math.PI/180);x.imageSmoothingQuality='high';x.drawImage(src,-tw/2,-th/2,tw,th);}
 else{c.width=tw;c.height=th;x.imageSmoothingQuality='high';x.drawImage(src,0,0,tw,th);}
 const d=x.getImageData(0,0,c.width,c.height);prep(d,mode);x.putImageData(d,0,0);return c;}
function fill(texts,final){const r=vote(texts);
 for(const k of order){const v=k=='exp'?toDMY(r.exp):r[k];if(v&&!touched[k]){$(k).value=v;$(k).classList.add('auto');}}
 // 有效期：把读到的日期都列成按钮，一点就换
 const all={};texts.forEach(t=>dates(t).forEach(d=>all[toDMY(d.t)]=(all[toDMY(d.t)]||0)+1));
 const ds=Object.keys(all).sort((a,b)=>(+b.slice(4)*10000+ +b.slice(2,4)*100+ +b.slice(0,2))-(+a.slice(4)*10000+ +a.slice(2,4)*100+ +a.slice(0,2)));
 $('dchips').innerHTML=ds.length>1?'<span style="font-size:13px;color:#555;align-self:center">读到的日期，点一下换：</span>':'';
 if(ds.length>1)ds.forEach(v=>{const c=document.createElement('button');c.className='chip';c.textContent=v.slice(0,2)+'/'+v.slice(2,4)+'/'+v.slice(4);c.onclick=()=>setF('exp',v);$('dchips').appendChild(c);});
 return r;}
function chips(texts){const cnt={};
 texts.forEach(t=>t.split(/\s+/).map(w=>w.replace(/^[^A-Za-z0-9]+|[^A-Za-z0-9]+$/g,'')).filter(w=>w.length>2&&/\d/.test(w)).forEach(w=>cnt[w]=(cnt[w]||0)+1));
 const words=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]).slice(0,40);$('chips').innerHTML='';
 words.forEach(w=>{const c=document.createElement('button');c.className='chip';c.textContent=w;
  c.onclick=()=>{setF(cur,cur=='exp'?toDMY(w):w);const i=order.indexOf(cur);if(i<2)pick(order[i+1]);};$('chips').appendChild(c);});}
async function onPic(e){
 const f=e.target.files[0];if(!f)return;e.target.value='';
 order.forEach(k=>{$(k).value='';$(k).classList.remove('auto');delete touched[k];});$('out').innerHTML='';$('dchips').innerHTML='';
 $('preview').src=URL.createObjectURL(f);$('preview').style.display='block';
 $('chips').innerHTML='';$('raw').textContent='';$('status').textContent='正在准备…';
 try{
  const img=await loadImg(f);const w=await getWorker();const texts=[];
  const run=async(p,i,n,rot)=>{$('status').textContent=`读字中 第 ${i}/${n} 遍…（共约 10–30 秒）`;
   await w.setParameters({tessedit_pageseg_mode:p.psm});const r=await w.recognize(render(img,p.L,p.mode,rot));
   texts.push(r.data.text);$('raw').textContent+=`--- 第 ${texts.length} 遍 (${p.mode} ${p.L}${rot?' 转'+rot+'°':''}) ---\n`+r.data.text+'\n';fill(texts);chips(texts);};
  for(let i=0;i<PASSES.length;i++)await run(PASSES[i],i+1,PASSES.length,0);
  let r=fill(texts);
  if(!r.sku&&!r.batch&&!r.exp){for(const rot of [90,270]){await run(PASSES[1],'转'+rot+'°',PASSES.length,rot);r=fill(texts);if(r.sku||r.batch||r.exp)break;}}
  const miss=order.filter(k=>!$(k).value).map(k=>({sku:'SKU',batch:'Batch',exp:'Expiry'})[k]);
  $('status').textContent=(r.expPast&&!touched.exp?'⚠️ 只读到已过去的日期（可能是生产日期），有效期请核对。':'')+(miss.length?'读完了，'+miss.join('、')+' 没找到：先选①②③，再点下面的字。':'读完了，三格已自动填好（黄色=自动猜的，请核对）。')+' 不对可以点字更换或直接改。';
  if(!miss.includes('SKU'))pick(miss.length?({SKU:'sku',Batch:'batch',Expiry:'exp'})[miss[0]]:'sku');
 }catch(err){$('status').textContent='读字失败：'+err.message+'。可以直接手动输入。';}
}
function make(){$('exp').value=toDMY($('exp').value);
 const out=$('out');out.innerHTML='';
 for(const [k,name] of [['sku','SKU'],['batch','Batch'],['exp','Expiry Date']]){
  const v=$(k).value.trim();if(!v)continue;
  const d=document.createElement('div');d.className='card';d.innerHTML='<b>'+name+'</b>';
  const s=document.createElementNS('http://www.w3.org/2000/svg','svg');d.appendChild(s);out.appendChild(d);
  try{JsBarcode(s,v,{format:'CODE128',height:70,fontSize:18,margin:8});}catch(e){d.innerHTML+='<div>这个内容不能做条码：'+e.message+'</div>';}
 }
 if(!out.innerHTML)out.innerHTML='<div class="card">三格都是空的，先填内容。</div>';
 out.scrollIntoView({behavior:'smooth'});
}
function clearAll(){order.forEach(k=>{$(k).value='';$(k).classList.remove('auto');delete touched[k];});$('chips').innerHTML='';$('dchips').innerHTML='';$('raw').textContent='';$('out').innerHTML='';$('preview').style.display='none';$('cam').value='';$('gal').value='';pick('sku');$('status').textContent='拍好后会自动读字并填好三格（v4）。';}
</script></body></html>
